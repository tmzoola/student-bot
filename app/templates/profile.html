{% extends "_base.html" %}
{% block title %}Profil — Student Bot{% endblock %}

{% block header %}
<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-logo-tx">👤 Profil</div>
  </div>
</header>
{% endblock %}

{% block head %}
<style>
.p-hero{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:var(--shadow-md);margin-bottom:16px;text-align:center}
.p-avatar{width:72px;height:72px;border-radius:50%;background:var(--amber);color:#fff;font-size:1.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.p-name{font-size:1.15rem;font-weight:800;color:var(--text);margin-bottom:4px}
.p-sid{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.p-verified{display:inline-flex;align-items:center;gap:5px;background:var(--green-lt);color:var(--green-dark);border-radius:20px;padding:4px 12px;font-size:.76rem;font-weight:700}

.p-info{background:var(--card);border-radius:16px;padding:4px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.p-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-lt);font-size:.88rem}
.p-row:last-child{border-bottom:none}
.p-row .k{color:var(--muted);font-weight:500}
.p-row .v{font-weight:700;color:var(--text)}

.att-card{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.att-body{flex:1;min-width:0}
.att-t{font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-d{font-size:.74rem;color:var(--muted)}
</style>
{% endblock %}

{% block content %}
<div id="profile"><div class="empty"><div class="empty-t">Yuklanmoqda…</div></div></div>
<div id="attempts-section" style="display:none">
  <div class="sec-label">So'nggi urinishlar</div>
  <div id="attempts"></div>
</div>
{% endblock %}

{% block script %}
<script>
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtDate(iso){
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString('uz-UZ', {dateStyle:'short', timeStyle:'short'}); }
    catch(e){ return iso; }
}
function initials(name){
    if (!name) return '?';
    return name.trim()[0].toUpperCase();
}

async function load(){
    const [pr, ar] = await Promise.all([
        fetch('/api/v1/profile', { headers: MK.authHeaders() }),
        fetch('/api/v1/profile/attempts', { headers: MK.authHeaders() }),
    ]);
    const pbox = document.getElementById('profile');
    if (pr.status === 403 || pr.status === 401) {
        pbox.innerHTML = '<div class="empty"><div class="empty-t">Ruxsat yo\'q</div><div class="empty-d">Profilingiz tasdiqlanmagan.</div></div>';
        return;
    }
    if (!pr.ok) {
        pbox.innerHTML = '<div class="empty"><div class="empty-t">Xatolik yuz berdi</div><div class="empty-d">Sahifani yangilang yoki keyinroq urinib ko\'ring.</div></div>';
        return;
    }
    const p = await pr.json();

    pbox.innerHTML = `
      <div class="p-hero">
        <div class="p-avatar" aria-hidden="true">${initials(p.full_name)}</div>
        <div class="p-name">${esc(p.full_name)}</div>
        <div class="p-sid">&#128196; ${esc(p.student_id_number)}</div>
        <div class="p-verified">&#10003; Tasdiqlangan</div>
      </div>

      <div class="p-info">
        <div class="p-row"><span class="k">Fakultet</span><span class="v">${esc(p.faculty_name)}</span></div>
        <div class="p-row"><span class="k">Kurs</span><span class="v">${p.course_number}-kurs</span></div>
        <div class="p-row"><span class="k">Semestr</span><span class="v">${p.semester}-semestr</span></div>
      </div>

      <div class="stats" style="margin-bottom:20px">
        <div class="stat-c stat-green"><div class="v">${p.attempts_count}</div><div class="l">Jami urinishlar</div></div>
        <div class="stat-c stat-blue"><div class="v">${p.average_percentage}%</div><div class="l">O'rtacha ball</div></div>
      </div>
    `;

    const abox = document.getElementById('attempts');
    const asec = document.getElementById('attempts-section');
    asec.style.display = '';

    if (!ar.ok) {
        abox.innerHTML = '<div style="font-size:.83rem;color:var(--muted);padding:4px 0">Urinishlar yuklanmadi.</div>';
        return;
    }
    const attempts = await ar.json();
    if (!attempts.length) {
        abox.innerHTML = '<div class="empty" style="padding:30px 20px"><div class="empty-t">Hali urinishlar yo\'q</div><div class="empty-d">Birinchi testni yeching va natijangiz shu yerda ko\'rinadi.</div></div>';
        return;
    }
    abox.innerHTML = attempts.map(a => `
        <div class="att-card">
          <div class="att-body">
            <div class="att-t">${esc(a.quiz_title)}</div>
            <div class="att-d">${a.score}/${a.total} · ${fmtDate(a.completed_at)}</div>
          </div>
          <span class="${a.percentage >= 60 ? 'badge-green' : 'badge-red'}" aria-label="Ball: ${a.percentage}%">${a.percentage}%</span>
        </div>
    `).join('');
}
load();
</script>
{% endblock %}
