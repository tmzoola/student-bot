{% extends "_base.html" %}
{% block title %}Profil{% endblock %}
{% block bottom_nav %}{% endblock %}

{% block header %}
<header class="hdr">
  <a href="/subjects" class="hdr-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="hdr-title" style="flex:1;padding:0 12px">Profil</div>
  <div class="hdr-right"></div>
</header>
{% endblock %}

{% block head %}
<style>
.p-card{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.p-name{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.p-id{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.p-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #f0f0f0;font-size:.88rem}
.p-row:first-of-type{border-top:none}
.p-row .k{color:var(--muted)}
.p-row .v{font-weight:600}
.att{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.att-t{font-size:.9rem;font-weight:600;margin-bottom:2px}
.att-d{font-size:.75rem;color:var(--muted)}
.att-p{font-weight:800;font-size:1rem}
.att-p.good{color:var(--green)}
.att-p.bad{color:var(--pink)}
</style>
{% endblock %}

{% block content %}
<div id="profile"><div class="empty"><div class="empty-t">Yuklanmoqda…</div></div></div>

<div class="section-t big" style="margin-top:8px">So'nggi urinishlar</div>
<div id="attempts"><div class="card-sub">…</div></div>
{% endblock %}

{% block script %}
<script>
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtDate(iso){
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString('uz-UZ', {dateStyle:'short', timeStyle:'short'}); }
    catch(e){ return iso; }
}

async function load(){
    const [pr, ar] = await Promise.all([
        fetch('/api/v1/profile', { headers: {'X-Init-Data': MK.initData }}),
        fetch('/api/v1/profile/attempts', { headers: {'X-Init-Data': MK.initData }}),
    ]);
    const pbox = document.getElementById('profile');
    if (pr.status === 403 || pr.status === 401) {
        pbox.innerHTML = '<div class="empty"><div class="empty-t">Ruxsat yo\'q</div></div>';
        return;
    }
    if (!pr.ok) {
        pbox.innerHTML = '<div class="empty"><div class="empty-t">Xatolik</div></div>';
        return;
    }
    const p = await pr.json();
    pbox.innerHTML = `
        <div class="p-card">
          <div class="p-name">${esc(p.full_name)}</div>
          <div class="p-id">🆔 ${esc(p.student_id_number)}</div>
          <div class="p-row"><span class="k">Fakultet</span><span class="v">${esc(p.faculty_name)}</span></div>
          <div class="p-row"><span class="k">Kurs</span><span class="v">${p.course_number}</span></div>
          <div class="p-row"><span class="k">Semestr</span><span class="v">${p.semester}</span></div>
        </div>
        <div class="stats">
          <div class="stat-c stat-green"><div class="v">${p.attempts_count}</div><div class="l">Urinish</div></div>
          <div class="stat-c stat-blue"><div class="v">${p.average_percentage}%</div><div class="l">O'rtacha</div></div>
          <div class="stat-c stat-amber"><div class="v">${p.attempts_count > 0 ? '⭐' : '—'}</div><div class="l">Faol</div></div>
        </div>
    `;

    const abox = document.getElementById('attempts');
    if (!ar.ok) {
        abox.innerHTML = '<div class="card-sub">Urinishlar yuklanmadi</div>';
        return;
    }
    const attempts = await ar.json();
    if (!attempts.length) {
        abox.innerHTML = '<div class="card-sub">Hali urinishlar yo\'q</div>';
        return;
    }
    abox.innerHTML = attempts.map(a => `
        <div class="att">
          <div style="min-width:0;flex:1">
            <div class="att-t">${esc(a.quiz_title)}</div>
            <div class="att-d">${a.score}/${a.total} · ${fmtDate(a.completed_at)}</div>
          </div>
          <div class="att-p ${a.percentage >= 60 ? 'good':'bad'}">${a.percentage}%</div>
        </div>
    `).join('');
}
load();
</script>
{% endblock %}
