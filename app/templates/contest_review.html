{% extends "_base.html" %}
{% block title %}Tahlil — Muslima Darmonova{% endblock %}
{% block bottom_nav %}{% endblock %}

{% block head %}
<style>
body{background:linear-gradient(180deg,#EEF3EA 0%,#F5F8F2 50%,#EEF3EA 100%);padding-bottom:24px}
.hero-r{background:#fff;border-radius:20px;padding:20px 18px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.hero-t{font-size:1.15rem;font-weight:800;color:#111;margin-bottom:4px}
.hero-s{font-size:.82rem;color:var(--muted);margin-bottom:14px}
.badges{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rb{background:#F4F5F2;border-radius:12px;padding:11px 6px;text-align:center}
.rb .v{font-size:1.1rem;font-weight:800;line-height:1.1;color:#111}
.rb .l{font-size:.66rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.rb-green .v{color:var(--green-dark)}
.rb-red .v{color:#c0392b}

.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec-title h3{font-size:.98rem;font-weight:800;color:#111;margin:0}

.qr{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--green)}
.qr.wrong{border-left-color:#f87171}
.qr.skip{border-left-color:#c8cdd4}
.qr-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qr-num{background:#f4f5f2;color:#555;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0}
.qr-status{margin-left:auto;font-size:.75rem;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.qr.correct .qr-status{color:var(--green-dark)}
.qr.wrong .qr-status{color:#c0392b}
.qr.skip .qr-status{color:#888}
.qr-text{font-size:.95rem;font-weight:600;color:#111;line-height:1.4;margin-bottom:12px}
.qr-img{display:block;max-width:100%;max-height:200px;border-radius:10px;margin-bottom:12px}
.qr-opts{display:flex;flex-direction:column;gap:6px}
.qr-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:#F8F9F7;font-size:.86rem;color:#333;line-height:1.35}
.qr-opt.is-correct{background:#E4F3EB;color:#1a7a3f;font-weight:600}
.qr-opt.is-wrong{background:#FDE8E8;color:#a02020;font-weight:600}
.qr-opt-letter{width:22px;height:22px;border-radius:6px;background:#e6e8e3;color:#666;font-weight:700;font-size:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qr-opt.is-correct .qr-opt-letter{background:var(--green);color:#fff}
.qr-opt.is-wrong .qr-opt-letter{background:#dc2626;color:#fff}
.qr-opt-text{flex:1}
.qr-opt-tag{font-size:.66rem;font-weight:700;padding:2px 6px;border-radius:5px;flex-shrink:0}
.qr-opt.is-correct .qr-opt-tag{background:rgba(255,255,255,.6);color:var(--green-dark)}
.qr-opt.is-wrong .qr-opt-tag{background:rgba(255,255,255,.6);color:#a02020}
.qr-expl{margin-top:10px;padding:10px 12px;background:#FFF9EA;border-radius:9px;font-size:.8rem;color:#7a5c11;line-height:1.5;border-left:3px solid #FFD966}
.msg{padding:16px;border-radius:12px;font-size:.9rem;background:#FFF3E0;color:#B5812E;font-weight:600;text-align:center}
</style>
{% endblock %}

{% block header %}
<header class="hdr">
  <a href="/webapp/contests/{{ contest_id }}" class="hdr-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="hdr-title">Tahlil</div>
  <div class="hdr-right"></div>
</header>
{% endblock %}

{% block content %}
<div id="content"><div class="empty" style="padding:40px 20px">Yuklanmoqda…</div></div>
{% endblock %}

{% block script %}
<script>
const CONTEST_ID = {{ contest_id }};

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const LETTERS = {A:'A',B:'B',C:'C',D:'D'};

function optionRow(letter, text, chosen, correct){
  const isCorrect = letter === correct;
  const isWrong = letter === chosen && chosen !== correct;
  const cls = isCorrect ? 'is-correct' : (isWrong ? 'is-wrong' : '');
  const tag = isCorrect ? '<span class="qr-opt-tag">To\'g\'ri</span>'
             : isWrong ? '<span class="qr-opt-tag">Sizning javob</span>' : '';
  return `<div class="qr-opt ${cls}">
    <div class="qr-opt-letter">${letter}</div>
    <div class="qr-opt-text">${esc(text)}</div>
    ${tag}
  </div>`;
}

function renderQuestion(q, i){
  let cls = 'correct', status = '✅ To\'g\'ri';
  if (!q.chosen){ cls = 'skip'; status = '➖ O\'tkazilgan'; }
  else if (!q.is_correct){ cls = 'wrong'; status = '❌ Xato'; }

  const img = q.image_url ? `<img class="qr-img" src="/media/${esc(q.image_url)}" alt="">` : '';
  const expl = q.explanation
    ? `<div class="qr-expl"><b>💡 Izoh:</b> ${esc(q.explanation)}</div>` : '';

  return `<div class="qr ${cls}">
    <div class="qr-head">
      <span class="qr-num">${i+1}-savol</span>
      <span class="qr-status">${status}</span>
    </div>
    ${q.text ? `<div class="qr-text">${esc(q.text)}</div>` : ''}
    ${img}
    <div class="qr-opts">
      ${optionRow('A', q.option_a, q.chosen, q.correct)}
      ${optionRow('B', q.option_b, q.chosen, q.correct)}
      ${optionRow('C', q.option_c, q.chosen, q.correct)}
      ${optionRow('D', q.option_d, q.chosen, q.correct)}
    </div>
    ${expl}
  </div>`;
}

(async function(){
  const user = await MK.ensureAuth();
  if (!user) return;

  const r = await fetch(`/api/v1/webapp/contests/${CONTEST_ID}/review`, {
    headers: MK.authHeaders(),
    credentials: 'same-origin',
  });
  const box = document.getElementById('content');
  if (r.status === 403){
    box.innerHTML = '<div class="msg">⏳ Tahlil musobaqa yakunlangach ochiladi.</div>';
    return;
  }
  if (r.status === 404){
    box.innerHTML = '<div class="msg">Siz bu musobaqada ishtirok etmagansiz.</div>';
    return;
  }
  if (!r.ok){
    box.innerHTML = '<div class="msg">Xatolik yuz berdi.</div>';
    return;
  }
  const d = await r.json();
  const a = d.attempt;
  const wrong = d.review.filter(q => q.chosen && !q.is_correct).length;
  const skip = d.review.filter(q => !q.chosen).length;

  const html = [];
  html.push(`<div class="hero-r">
    <div class="hero-t">${esc(d.contest.title)}</div>
    <div class="hero-s">Yakuniy natija · ${a.percentage}%</div>
    <div class="badges">
      <div class="rb rb-green"><div class="v">${a.score}</div><div class="l">To'g'ri</div></div>
      <div class="rb rb-red"><div class="v">${wrong}</div><div class="l">Xato</div></div>
      <div class="rb"><div class="v">${skip}</div><div class="l">O'tkazilgan</div></div>
    </div>
  </div>`);

  html.push(`<div class="sec-title"><h3>Savollar tahlili</h3>
    <span style="font-size:.74rem;color:var(--muted);font-weight:600">${d.review.length} ta savol</span></div>`);
  d.review.forEach((q,i)=>html.push(renderQuestion(q,i)));

  box.innerHTML = html.join('');
})();
</script>
{% endblock %}
