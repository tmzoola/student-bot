# Grafana ishga tushganda avtomatik Loki datasource qo'shadi.
# Bu fayl `/etc/grafana/provisioning/datasources/` ga mount qilinadi.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      timeout: 60
      maxLines: 5000
