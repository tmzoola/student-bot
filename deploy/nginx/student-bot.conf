# /etc/nginx/sites-available/student-bot.conf
# ─────────────────────────────────────────────────────────────────────
# Student-bot reverse proxy — student-13-140-165-210.sslip.io
#
# O'rnatish:
#   sudo cp deploy/nginx/student-bot.conf /etc/nginx/sites-available/student-bot.conf
#   sudo ln -s /etc/nginx/sites-available/student-bot.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS sertifikat (Let's Encrypt orqali, avval HTTP blok yashaydi):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d student-13-140-165-210.sslip.io
#   (avtomatik yangilanish: `systemctl status certbot.timer`)
#
# Dozzle uchun basic auth fayl:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd_student_logs admin
# ─────────────────────────────────────────────────────────────────────

# WebSocket upgrade uchun umumiy map (Dozzle real-vaqt log, Grafana Live).
# Agar `/etc/nginx/conf.d/websocket_upgrade.conf` da allaqachon bo'lsa
# (masalan boshqa loyiha uchun) — pastdagi map blokini o'chirib tashlang.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect. Certbot ishga tushgach 80/certbot challenge yo'lini
# saqlab, qolganini 443 ga yo'naltiradi.
server {
    listen 80;
    listen [::]:80;
    server_name student-13-140-165-210.sslip.io;

    # Let's Encrypt HTTP-01 challenge uchun (certbot --nginx buni o'zi qo'shadi).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name student-13-140-165-210.sslip.io;

    # ── Sertifikat (certbot avtomatik yozadi) ──────────────────────
    # ssl_certificate     /etc/letsencrypt/live/student-13-140-165-210.sslip.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/student-13-140-165-210.sslip.io/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Umumiy sozlamalar ──────────────────────────────────────────
    # Media/kitob yuklash uchun (agar Bosqich 3'da kerak bo'lsa).
    client_max_body_size 100M;

    # Slashsiz variantlar location /... / ni ushlamaydi — 404 bo'lmasin.
    location = /logs    { return 301 /logs/; }
    location = /grafana { return 301 /grafana/; }

    # ── Dozzle: real-vaqt log UI ───────────────────────────────────
    # Dozzle o'z auth'i yo'q — nginx basic auth bilan yopamiz.
    location /logs/ {
        auth_basic           "Student-bot log viewer";
        auth_basic_user_file /etc/nginx/.htpasswd_student_logs;

        proxy_pass http://127.0.0.1:8080/logs/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Real-vaqt log streaming WebSocket ustida ishlaydi.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_buffering    off;
    }

    # ── Grafana: dashboard, log tarixi, alerting ───────────────────
    # Grafana o'z login'i bor (admin/GRAFANA_ADMIN_PASSWORD), qo'shimcha
    # basic auth kerak emas. DIQQAT: proxy_pass oxirida `/` YO'Q —
    # aks holda subpath redirect loop bo'ladi (GF_SERVER_SERVE_FROM_SUB_PATH=true).
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live features (real-vaqt panel yangilanishi).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
    }

    # ── Asosiy app (FastAPI + starlette-admin + WebApp) ────────────
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzoq so'rovlar (AI analiz, statistika) uchun timeout.
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    # Foydali log formati (kim, qachon, qaysi status).
    access_log /var/log/nginx/student-bot.access.log;
    error_log  /var/log/nginx/student-bot.error.log warn;
}
