x-log-opts: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

services:
  db:
    image: postgres:15-alpine
    container_name: student_db
    restart: always
    logging: *default-logging
    # App pool (60) + guard/scripts + zaxira. 1000+ parallel foydalanuvchi
    # uchun default 100 kam bo'lishi mumkin.
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POSTGRES_DB: ${POSTGRES_DB:-student}
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-student}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: student_redis
    restart: always
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: student_app
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override .env's localhost so the app reaches the db container
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      UVICORN_WORKERS: "2"
      TZ: Asia/Tashkent
    volumes:
      # Uploaded files (books etc.) must survive image rebuilds
      - media_data:/project/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Bot polling + background worker'lar (reengagement, pending_joins).
  # WebApp app konteynerlari polling qilmaydi — TelegramConflictError yo'q,
  # background task'lar N marta takrorlanmaydi.
  bot:
    build: .
    container_name: student_bot
    restart: always
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Tashkent
    working_dir: /project/app
    entrypoint: ["python", "-m", "bot_main"]
    volumes:
      - media_data:/project/app/media
    healthcheck:
      disable: true

  # ─────────────────────────────────────────────────────────────────
  # Log kuzatuv stack: Dozzle (real-vaqt UI) + Loki + Promtail + Grafana
  # (tarix + qidiruv + alerting). Nginx tarafda subpath'ga proxy:
  #   ob-student.timv.uz/logs      → dozzle:8080
  #   ob-student.timv.uz/grafana   → grafana:3000
  # ─────────────────────────────────────────────────────────────────

  # Dozzle — real-vaqt log ko'rish uchun engil UI (~30 MB RAM).
  # Auth Nginx tarafda basic auth bilan qilinadi (soddaroq).
  dozzle:
    image: amir20/dozzle:v8.10.6
    container_name: student_dozzle
    restart: always
    logging: *default-logging
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_LEVEL: warn
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/logs/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Loki — log ma'lumotlar bazasi (log'ni siqib saqlaydi + LogQL).
  loki:
    image: grafana/loki:3.2.0
    container_name: student_loki
    restart: always
    logging: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Promtail — barcha konteynerdan log'ni yig'ib Loki'ga uzatuvchi agent.
  promtail:
    image: grafana/promtail:3.2.0
    container_name: student_promtail
    restart: always
    logging: *default-logging
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - promtail_positions:/tmp
    depends_on:
      - loki

  # Grafana — brauzer UI, dashboard, alerting.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: student_grafana
    restart: always
    logging: *default-logging
    environment:
      GF_SERVER_ROOT_URL: "https://ob-student.timv.uz/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: "light"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    expose:
      - "3000"
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/grafana/api/health || wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  media_data:
  redis_data:
  loki_data:
  grafana_data:
  promtail_positions:
